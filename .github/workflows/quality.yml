name: quality

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: woodruffw/zizmor-action@v0
        with:
          min-severity: high

  secret-diff:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: collect changed files
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=50
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base"...HEAD | grep -Ev '^(node_modules|.nuxt|.terraform)/' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "files<<EOF" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${files[@]}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: trivy fs secret (diff)
        if: steps.changed.outputs.no_changes != 'true'
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          tmpdir=$(mktemp -d)
          while IFS= read -r f; do
            if [ -f "$f" ]; then
              mkdir -p "$tmpdir/$(dirname "$f")"
              cp "$f" "$tmpdir/$f"
            fi
          done <<< "$FILES"
          docker run --rm -v "$tmpdir:/scan:ro" aquasec/trivy:0.70.0 \
            fs --scanners secret --severity HIGH,CRITICAL --exit-code 1 /scan
