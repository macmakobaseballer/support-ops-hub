name: terraform

on:
  push:
    branches: [main, develop]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: cache terraform plugins
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: tf-plugins-${{ hashFiles('infra/terraform/**/versions.tf', 'infra/terraform/envs/**/main.tf') }}

      - run: terraform fmt -recursive -check

      - name: init dev
        run: terraform init -backend=false -input=false
        working-directory: infra/terraform/envs/dev

      - name: validate dev
        run: terraform validate
        working-directory: infra/terraform/envs/dev

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: cache tflint plugins
        uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('infra/terraform/.tflint.hcl') }}

      - run: tflint --init
      - run: tflint --recursive

      - name: trivy config (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: '1'
