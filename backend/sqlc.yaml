version: "2"
sql:
  - engine: "mysql"
    queries: "internal/db/queries/"
    schema: "internal/db/migrations/"
    gen:
      go:
        package: "db"
        out: "internal/db/sqlc"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_db_tags: true
        emit_prepared_queries: false
        emit_interface: false
        overrides:
          - db_type: "tinyint(1)"
            go_type: "bool"
          - db_type: "datetime"
            go_type: "time.Time"
