version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - misspell

  settings:
    gosec:
      excludes:
        - G104  # errcheck がカバー

  exclusions:
    paths:
      - internal/apigen
      - internal/db/sqlc
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofumpt
